name: Run Daraz Price Spy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# CRITICAL: This gives GitHub permission to save files back to your repository
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Scraper Script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        python daraz_scraper.py

    # NEW STEP: Automatically commit and push the updated price file
    - name: Commit and Push Price Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Automated price update [skip ci]" || echo "No price changes to save"
        git push
